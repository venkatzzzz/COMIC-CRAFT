<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Comic Exported Successfully</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    background: #eef2ff;
    color: #172033;
}

.success-card {

    width: 90%;
    max-width: 700px;

    background: white;

    padding: 60px 40px;

    border-radius: 20px;

    text-align: center;

    box-shadow: 0 10px 35px #0002;
}

.icon {

    font-size: 70px;

    margin-bottom: 15px;
}

h1 {

    color: #166534;

    margin-bottom: 15px;

    font-size: 32px;
}

.message {

    color: #475569;

    font-size: 17px;

    line-height: 1.6;

    margin-bottom: 30px;
}

.button {

    display: inline-block;

    padding: 14px 25px;

    background: #2563eb;

    color: white;

    text-decoration: none;

    border-radius: 10px;

    font-size: 17px;

    font-weight: bold;
}

.button:hover {

    background: #1d4ed8;
}

</style>

</head>


<body>


<div class="success-card">


    <div class="icon">
        ✅
    </div>


    <h1>
        Comic Exported Successfully!
    </h1>


    <p class="message">

        Your AI-powered comic has been successfully
        created and exported.

        <br><br>

        Dive back in and bring another story to life.

    </p>


    <a
        class="button"
        href="/"
    >
        🎨 Go Create Another Comic
    </a>


</div>


</body>

</html>
